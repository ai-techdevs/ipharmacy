<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>ipharmacy</title>
    <!-- Bootstrap -->
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- fontawesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" media="all">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link href="css/slick.css" rel="stylesheet" media="all">
    <link href="css/aos.css" rel="stylesheet" media="all">
    <link href="css/menu.css" rel="stylesheet" media="all">
    <link href="css/style.css" rel="stylesheet" media="all">
    <link href="css/responsive.css" rel="stylesheet" media="all">
    
  </head>
  <body>
    
    <section class="login-register-body">
      <div class="login-register-wrapper">
        <div class="logo-wrap">
          <a href="index.html">
            <img class="img-fluid" src="images/logo.png" alt="">
          </a>
        </div>
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-12 col-md-6">
              <div class="login-register-form-wrap">
                <div class="login-register-nav mb-5">
                  <ul class="nav nav-tabs" id="logregNav">
                    <li class="nav-item">
                      <a class="nav-link active" href="#" data-tab="tab1">Login</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="#" data-tab="tab2">Signup</a>
                    </li>
                  </ul>
                </div>
                
                <!-- First Tab Content Set -->
                <div class="tab-content" id="tabContentOne">
                  <div class="tab-pane fade show active" id="tab1-pane-1">
                    <div class="login-register-form">
                      <div class="title mb-4">
                        <h3>Log in to your account</h3>
                        <p>Enter your email address and password to log in.</p>
                      </div>
                      <form action="">
                        <div class="login-register-form-inner">
                          <div class="row">
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Email or mobile number</label>
                                <input class="form-control" type="email" placeholder="youremail@gmail.com" />
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Password</label>
                                <div class="password-input">
                                  <input class="form-control" type="password" placeholder="********" />
                                  <i class="toggle-password fa fa-fw fa-eye-slash"></i>
                                </div>
                              </div>
                            </div>
                            <div class="col-12 mb-5">
                              <div class="form-group forgot-pass">
                                <h5><a href="#">Forgot Password?</a></h5>
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <input class="btn common-btn2" type="submit" value="Login" />
                              </div>
                            </div>
                            <div class="col-12">
                              <div class="form-group dont-have-account">
                                <h5>Don’t have an account? <a id="dont_account_SignUp" href="#" data-tab="tab2">SignUp</a></h5>
                              </div>
                            </div>
                          </div>
                        </div>
                      </form>
                    </div>
                  </div>
                  <div class="tab-pane fade" id="tab2-pane-1">
                    <div class="login-register-form">
                      <div class="title mb-4">
                        <h3>Create your account</h3>
                        <p>Enter your fields below to get started</p>
                      </div>
                      <form action="">
                        <div class="login-register-form-inner">
                          <div class="row">
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>First Name</label>
                                <input class="form-control" type="text" placeholder="Alexiya" />
                              </div>
                            </div>
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>Last Name</label>
                                <input class="form-control" type="text" placeholder="Johnson" />
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Email </label>
                                <input class="form-control" type="email" placeholder="youremail@gmail.com" />
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Mobile </label>
                                <input class="form-control" type="text" placeholder="+1 458-569-568" />
                              </div>
                            </div>
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>Age Group</label>
                                <select class="form-select">
                                  <option>18-30</option>
                                  <option>18-30</option>
                                  <option>18-30</option>
                                  <option>18-30</option>
                                </select>
                              </div>
                            </div>
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>Gender</label>
                                <select class="form-select">
                                  <option>Male</option>
                                  <option>Female</option>
                                  <option>Others</option>
                                </select>
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Address 1 </label>
                                <textarea class="form-control" placeholder="your address*" rows="3"></textarea>
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Address 2 </label>
                                <textarea class="form-control" placeholder="your address*" rows="3"></textarea>
                              </div>
                            </div>
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>City</label>
                                <input class="form-control" type="text" placeholder="City" />
                              </div>
                            </div>
                            <div class="col-12 col-md-6 mb-4">
                              <div class="form-group">
                                <label>State</label>
                                <select class="form-select">
                                  <option>USA</option>
                                  <option>India</option>
                                  <option>UK</option>
                                </select>
                              </div>
                            </div>
                            <div class="col-12 col-md-12 mb-4">
                              <div class="form-group">
                                <label>Zip</label>
                                <input class="form-control" type="text" placeholder="Zip" />
                              </div>
                            </div>
                            <div class="col-12 col-md-12 mb-4">
                              <div class="form-group">
                                <label>Password</label>
                                <input class="form-control" type="password" placeholder="********" />
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <label>Confirm Password</label>
                                <input class="form-control" type="password" placeholder="********" />
                              </div>
                            </div>
                            <div class="col-12 mb-5">
                              <div class="form-group">
                                <div class="form-check">
                                  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                                  <label class="form-check-label" for="flexCheckDefault">
                                    I’m agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                                  </label>
                                </div>
                              </div>
                            </div>
                            <div class="col-12 mb-4">
                              <div class="form-group">
                                <input class="btn common-btn2" type="submit" value="Sign Up" />
                              </div>
                            </div>
                            <div class="col-12">
                              <div class="form-group dont-have-account">
                                <h5>Already have an account? <a href="#" id="have_account_Login" data-tab="tab2">Login</a></h5>
                              </div>
                            </div>
                          </div>
                        </div>
                      </form>
                    </div>

                  </div>
                </div>

              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="login-register-right-img">
                <!-- Second Tab Content Set -->
                <div class="tab-content" id="tabContentTwo">
                  <div class="tab-pane fade show active" id="tab1-pane-2">
                    <img class="img-fluid" src="images/login-img1.png" alt="">
                  </div>
                  <div class="tab-pane fade" id="tab2-pane-2">
                    <img class="img-fluid" src="images/register-img1.png" alt="">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/slick.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/external.js"></script>
  </body>
</html>
