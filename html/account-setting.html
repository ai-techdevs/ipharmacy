    <section class="user-dashboard-wrapper">
      <div class="user-dashboard-inner-wrap">

              <a href="user-dashboard.html">
                <img class="img-fluid" src="images/logo.png" alt="">
              </a>
            </div>
            <div class="db-menu-wrap">
              <ul>
                <li class="active">
                  <a href="user-dashboard.html"> <span class="icon"> <img class="img-fluid" src="images/db-dashboard-home.svg" alt=""> </span> Dashboard</a>

                  <a href="#"> <span class="icon"> <img class="img-fluid" src="images/db-drug-information-icon.svg" alt=""> </span> Drug Information</a>

                </li>
              </ul>
            </div>

          <div class="logout-btn-wrap">
            <a href="#" class="logout-btn">
              <i class="fa-solid fa-arrow-right"></i> Logout
            </a>
          </div>
        </div>
        <div class="dashboard-body">
          <div class="db-header-wrapper">
            <div class="header-left-search">
              <div class="db-head-search">
                <form>
                  <div class="search-box-inner">
                    <div class="search-btn-wrp">
                      <button class="search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                    <div class="search-box">
                      <input class="form-control" type="search" name="" placeholder="Search drug information...">
                    </div>
                  </div>
                </form>
              </div>
            </div>
            <div class="user-notification-wrap">
              <ul class="user-notification-inner">
                <li class="notification-wrap">
                  <a href="#" class="notification-btn">
                    <i class="fa-regular fa-bell"></i>
                  </a>
                </li>
                <li class="user-dropdown">
                  <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                      <span class="user-img">
                        <img class="img-fluid" src="images/auth-img2.jpg" alt="">
                      </span>
                      <div class="user-details">
                        <h5>Alena Johnson</h5>
                        <p>Customer</p>
                      </div>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                      <li><a class="dropdown-item" href="account-setting.html">Account Setting</a></li>
                      <li><a class="dropdown-item" href="#">Logout</a></li>

          <div class="db-body-inner">
            <div class="row">
              <div class="col-12">
                <div class="account-setting-wrap">
                  <h3>Account Setting</h3>
                  <div class="account-profile-picture-change">
                    <div class="account-profile-picname">
                      <div class="profile-img">
                        <img class="img-fluid" src="images/auth-img4.jpg" alt="">
                      </div>
                      <div class="profile-name">
                        <h5>Alena Johnson</h5>
                        <p>Customer</p>
                      </div>
                    </div>
                    <div class="picture-change-btn">
                      <div class="file-input">
                        <input
                          type="file"
                          name="file-input"
                          id="file-input"
                          class="file-input__input"
                        />
                        <label class="file-input__label" for="file-input">
                          <span>Change Avatar</span>
                        </label>
                      </div>
                    </div>
                  </div>
                  <form>
                    <div class="account-setting-form-wrap">
                      <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>First Name</label>
                            <input class="form-control" type="text" placeholder="First Name" value="Alexiya"/>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Last Name</label>
                            <input class="form-control" type="text" placeholder="Last Name" value="Johnson"/>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Email</label>
                            <input class="form-control" type="text" placeholder="Email" value="youremail@gmail.com"/>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Mobile</label>
                            <input class="form-control" type="text" placeholder="Mobile" value="+1 458-569-568"/>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Age Group</label>
                            <select class="form-select">
                              <option>18-30</option>
                              <option>18-30</option>
                              <option>18-30</option>
                            </select>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Mobile</label>
                            <select class="form-select">
                              <option>Male</option>
                              <option>Female</option>
                              <option>Other</option>
                            </select>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Address 1</label>
                            <textarea class="form-control" rows="4" placeholder="Your address"></textarea>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Address 2</label>
                            <textarea class="form-control" rows="4" placeholder="Your address"></textarea>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>City</label>
                            <input class="form-control" type="text" placeholder="City" value="New York"/>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>State</label>
                            <select class="form-select">
                              <option>USA</option>
                              <option>UK</option>
                              <option>India</option>
                            </select>
                          </div>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                          <div class="form-group">
                            <label>Zip</label>
                            <input class="form-control" type="text" placeholder="|" value="744586"/>
                          </div>
                        </div>
                        <div class="col-12 mb-3">
                          <div class="form-group">
                            <h4>Medical Conditions*</h4>
                          </div>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                          <div class="form-group">
                            <label>Existing medical conditions?</label>
                            <input class="form-control" type="text" placeholder="|" value=""/>
                          </div>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                          <div class="form-group">
                            <label>Currently taking medications?</label>
                            <input class="form-control" type="text" placeholder="|" value=""/>
                          </div>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                          <div class="form-group">
                            <label>Known allergies?</label>
                            <input class="form-control" type="text" placeholder="|" value=""/>
                          </div>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                          <div class="form-group">
                            <label>Any previous surgeries? </label>
                            <input class="form-control" type="text" placeholder="|" value=""/>
                          </div>
                        </div>
                        <div class="col-12 col-md-8">
                          <div class="form-btn-wrap">
                            <ul>
                              <li>
                                <button class="btn discard-btn" type="submit">Discard</button>
                              </li>
                              <li>
                                <button class="btn common-btn2" type="submit">Save</button>
                              </li>
                            </ul>
                          </div>
                        </div>

                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
